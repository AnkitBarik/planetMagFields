[project]
name = "planetMagFields"
dynamic = ["version"]
authors = [
  { name="Ankit Barik", email="ankit.barik@gmail.com" },
]
maintainers = [
  { name="Ankit Barik", email="ankit.barik@gmail.com" },
  { name="Regupathi Angappan", email="rangapp1@jhu.edu" },
]
description = "Routines to easily access information about magnetic fields of planets in our solar system and visualize them in both 2D and 3D"
keywords = ['Spherical Harmonics','Planetary Science','Spectra','Magnetic Field','Visualization','3D visualization']
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization"
]

dependencies = [
  "numpy>=1.18",
  "scipy>=1.15",
  "matplotlib>=3"
]

[project.optional-dependencies]
map = ["cartopy"]
potextra = ["shtns"]
vtk = ["pyevtk"]
3d = ["pyvista"]
webapp = ["streamlit", "plotly", "pandas"]
test = ["pytest"]
all = ["cartopy", "shtns", "pyevtk", "pyvista", "streamlit", "plotly", "pandas"]

[project.scripts]
magfield = "planetmagfields.cli:main"

[project.urls]
Homepage = "https://ankitbarik.github.io/planetMagFields/"
Issues = "https://github.com/AnkitBarik/planetMagFields/issues"

[tool.setuptools]
packages = ["planetmagfields"]

[tool.setuptools.package-data]
planetmagfields = ["config.json", "data/*"]

[tool.setuptools.dynamic]
version = {attr = "planetmagfields.__version__"}

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
