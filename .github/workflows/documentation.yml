name: documentation

on: [push, pull_request, workflow_dispatch]

# Deploys the Sphinx docs to https://ankitbarik.github.io/planetMagFields/
# and the web app to https://ankitbarik.github.io/planetMagFields/app/

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
      - name: Install dependencies
        run: |
          python3 -m pip install numpy scipy matplotlib
          python3 -m pip install setuptools sphinx furo
          python3 -m pip install sphinxcontrib-bibtex
          python3 -m pip install sphinx-copybutton
      - name: Sphinx build
        run: |
          python3 -m pip install .
          sphinx-build doc _build
      - name: Build three.js web app
        run: |
          python3 webapp/build_data.py --out _build/app/data
          cp -r webapp/index.html webapp/style.css webapp/js webapp/og-image.jpg _build/app/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
